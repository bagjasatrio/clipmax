[project]
name = "clipmax"
version = "2.4.0"
description = "Autonomous Desktop AI Video Clipper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "faster-whisper>=1.0.0",
    "mediapipe>=0.10.9",
    "opencv-python>=4.8.0",
    "openai>=1.12.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyside6>=6.6.0",
    "yt-dlp>=2024.0.0",
    "nvidia-cublas-cu12>=12.1.0",
    "nvidia-cudnn-cu12>=9.0.0",
    "scenedetect>=0.7.1",
    "pywebview>=6.2.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
    "python-multipart>=0.0.32",
    "yt-dlp-youtube-oauth2>=1.0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
